<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neptune Admin Panel</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface2: #242836;
            --primary: #4f8cff;
            --danger: #ff4d4d;
            --success: #4dff88;
            --warning: #ffb84d;
            --text: #e0e0e0;
            --text-dim: #a0a0a0;
            --border: #2e3440;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; margin: 0; }
        a { color: var(--primary); text-decoration: none; }
        button { cursor: pointer; }
        .sidebar { width: 240px; background: var(--surface); padding: 20px 0; display: flex; flex-direction: column; border-right: 1px solid var(--border); position: fixed; height: 100vh; overflow-y: auto; z-index: 10; }
        .sidebar .logo { padding: 0 20px 20px; font-size: 1.3em; font-weight: bold; color: var(--primary); border-bottom: 1px solid var(--border); margin-bottom: 20px; }
        .sidebar nav { display: flex; flex-direction: column; flex: 1; }
        .sidebar nav a { display: flex; align-items: center; padding: 12px 20px; color: var(--text-dim); transition: all .2s; cursor: pointer; }
        .sidebar nav a:hover, .sidebar nav a.active { background: var(--surface2); color: var(--text); border-left: 3px solid var(--primary); }
        .sidebar-icon { margin-right: 10px; font-size: 1.2em; }
        .main { margin-left: 240px; padding: 20px; flex: 1; width: calc(100% - 240px); }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .topbar h1 { font-size: 1.5em; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 0.85em; font-weight: 500; }
        .badge.online { background: rgba(77, 255, 136, 0.2); color: var(--success); }
        .badge.offline { background: rgba(255, 77, 77, 0.2); color: var(--danger); }
        .badge.warning { background: rgba(255, 184, 77, 0.2); color: var(--warning); }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .card h2, .card h3 { margin-bottom: 15px; color: var(--primary); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .stat { font-size: 2em; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-dim); font-weight: 500; font-size: 0.9em; }
        input, select, textarea { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 8px; width: 100%; margin-bottom: 10px; font-size: 14px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
        input[type="checkbox"] { width: auto; margin-right: 5px; cursor: pointer; }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 500; transition: opacity .2s; }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.danger { background: var(--danger); }
        button.success { background: var(--success); color: #000; }
        button.warning { background: var(--warning); color: #000; }
        button.info { background: #6c5ce7; }
        button.small { padding: 5px 10px; font-size: 0.85em; }
        button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .modal-backdrop { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal { background: var(--surface); padding: 30px; border-radius: 16px; width: 500px; max-width: 90%; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
        .hidden { display: none !important; }
        .toast { position: fixed; top: 20px; right: 20px; padding: 15px 25px; border-radius: 8px; z-index: 200; animation: slideIn .3s ease; max-width: 400px; }
        .toast.success { background: var(--success); color: #000; }
        .toast.error { background: var(--danger); color: white; }
        .toast.warning { background: var(--warning); color: #000; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .chat-messages { height: 400px; overflow-y: auto; background: var(--surface2); padding: 15px; border-radius: 8px; margin-bottom: 10px; font-family: monospace; font-size: 13px; }
        .chat-message { margin-bottom: 6px; padding: 2px 0; }
        .chat-message .time { color: var(--text-dim); margin-right: 8px; }
        .chat-message .player { color: var(--primary); font-weight: 500; margin-right: 8px; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-bar input { flex: 1; margin-bottom: 0; }
        .info-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
        .info-label { color: var(--text-dim); font-weight: 500; }
        .info-value { color: var(--text); word-break: break-all; text-align: right; }
        .token-display { background: var(--surface2); padding: 10px; border-radius: 6px; font-family: monospace; font-size: 0.85em; cursor: pointer; word-break: break-all; border: 1px solid var(--border); }
        .token-display:hover { background: var(--border); }
        .checkbox-group { display: flex; gap: 15px; margin-bottom: 10px; flex-wrap: wrap; }
        .checkbox-group label { display: flex; align-items: center; cursor: pointer; color: var(--text-dim); }
        .actions-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .console-output { background: #0a0a0f; color: #4dff88; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; min-height: 200px; max-height: 400px; overflow-y: auto; margin-bottom: 10px; white-space: pre-wrap; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .back-btn { margin-bottom: 15px; }
        .quick-durations { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .quick-durations button { padding: 6px 12px; font-size: 0.85em; background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
        .quick-durations button:hover { background: var(--primary); border-color: var(--primary); }
        @media (max-width: 768px) {
            .sidebar { width: 60px; padding: 10px 0; }
            .sidebar .logo { font-size: 0; padding: 10px 0; }
            .sidebar .logo::after { content: 'N'; font-size: 20px; font-weight: bold; color: var(--primary); }
            .sidebar nav a { padding: 15px; justify-content: center; }
            .sidebar nav a span:not(.sidebar-icon) { display: none; }
            .sidebar-icon { margin-right: 0; }
            .main { margin-left: 60px; width: calc(100% - 60px); padding: 10px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="loginScreen" class="modal-backdrop">
        <div class="modal" style="width: 400px;">
            <h2 style="margin-bottom: 20px; color: var(--primary);">Neptune Admin</h2>
            <p style="margin-bottom: 20px; color: var(--text-dim);">Zaloguj się do panelu</p>
            <input type="text" id="loginUsername" placeholder="Username" autocomplete="username">
            <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
            <button onclick="login()" id="loginBtn" style="width: 100%; margin-top: 10px;">LOGIN</button>
            <div id="loginError" style="color: var(--danger); margin-top: 10px; text-align: center;"></div>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="logo">Neptune</div>
        <nav id="sidebarNav">
            <a href="#" data-page="dashboard"><span class="sidebar-icon">🏠</span><span>Dashboard</span></a>
            <a href="#" data-page="servers"><span class="sidebar-icon">🖥</span><span>Servers</span></a>
            <a href="#" data-page="chat"><span class="sidebar-icon">💬</span><span>Live Chat</span></a>
            <a href="#" data-page="console"><span class="sidebar-icon">⌨</span><span>RCON Console</span></a>
            <a href="#" data-page="players"><span class="sidebar-icon">👥</span><span>Players</span></a>
            <a href="#" data-page="moderation"><span class="sidebar-icon">🛡</span><span>Moderation</span></a>
            <a href="#" data-page="automessages"><span class="sidebar-icon">📢</span><span>AutoMessages</span></a>
            <a href="#" data-page="filters"><span class="sidebar-icon">🚫</span><span>Filters</span></a>
            <a href="#" data-page="messages"><span class="sidebar-icon">📁</span><span>Messages</span></a>
            <a href="#" data-page="admins"><span class="sidebar-icon">👤</span><span>Administrators</span></a>
            <a href="#" data-page="logs"><span class="sidebar-icon">📜</span><span>Logs</span></a>
            <a href="#" data-page="settings"><span class="sidebar-icon">⚙</span><span>Settings</span></a>
            <a href="#" onclick="logout()" style="margin-top: auto; border-top: 1px solid var(--border);"><span class="sidebar-icon">🚪</span><span>Logout</span></a>
        </nav>
    </div>

    <div class="main">
        <div class="topbar">
            <h1 id="pageTitle">Dashboard</h1>
            <div id="backendStatus">
                Backend: <span class="badge online">ONLINE</span> | 
                WebSocket: <span class="badge online" id="wsStatus">CONNECTED</span>
            </div>
        </div>
        <div id="content"></div>
    </div>

    <div id="toastContainer"></div>

    <script>
        let authToken = localStorage.getItem('neptune_token') || null;
        let wsPanel = null;
        let wsReconnectAttempts = 0;
        let currentPage = 'dashboard';
        let currentServerId = null;
        let serversList = [];

        function esc(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        function formatDurationMs(ms) {
            if (!ms || ms <= 0) return '-';
            const totalSec = Math.floor(ms / 1000);
            const days = Math.floor(totalSec / 86400);
            const hours = Math.floor((totalSec % 86400) / 3600);
            const minutes = Math.floor((totalSec % 3600) / 60);
            const seconds = totalSec % 60;
            const parts = [];
            if (days > 0) parts.push(days + 'd');
            if (hours > 0) parts.push(hours + 'h');
            if (minutes > 0) parts.push(minutes + 'm');
            if (seconds > 0 && parts.length === 0) parts.push(seconds + 's');
            return parts.join(' ') || '0s';
        }

        function getWebSocketUrl(path) {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            return `${protocol}//${window.location.host}${path}`;
        }

        function connectPanelWS() {
            if (!authToken) return;
            if (wsPanel && (wsPanel.readyState === WebSocket.OPEN || wsPanel.readyState === WebSocket.CONNECTING)) return;
            if (wsPanel) { wsPanel.close(); wsPanel = null; }
            
            const wsUrl = getWebSocketUrl(`/ws-panel?token=${encodeURIComponent(authToken)}`);
            
            try {
                wsPanel = new WebSocket(wsUrl);
                wsPanel.onopen = () => { wsReconnectAttempts = 0; updateWSStatus(true); };
                wsPanel.onmessage = (event) => {
                    try { handleRealtimeEvent(JSON.parse(event.data)); } catch (e) {}
                };
                wsPanel.onerror = () => updateWSStatus(false);
                wsPanel.onclose = () => {
                    wsPanel = null;
                    updateWSStatus(false);
                    if (authToken && wsReconnectAttempts < 10) {
                        const delay = Math.min(1000 * Math.pow(2, wsReconnectAttempts), 30000);
                        wsReconnectAttempts++;
                        setTimeout(() => { if (authToken) connectPanelWS(); }, delay);
                    }
                };
            } catch (e) { updateWSStatus(false); }
        }

        function updateWSStatus(connected) {
            const el = document.getElementById('wsStatus');
            if (el) { el.textContent = connected ? 'CONNECTED' : 'DISCONNECTED'; el.className = connected ? 'badge online' : 'badge offline'; }
        }

        function handleRealtimeEvent(data) {
            if (data.type === 'CHAT_MESSAGE' && currentPage === 'chat' && (!currentServerId || data.server_id === currentServerId)) appendChatMessage(data);
            if (data.type === 'SERVER_STATUS' && (currentPage === 'servers' || currentPage === 'dashboard')) { if (currentPage === 'servers') loadServers(); else loadDashboard(); }
            if (data.type === 'MODERATION_ACTION' && currentPage === 'moderation') loadModeration();
            if (data.type === 'INITIAL_DATA') { serversList = data.servers || []; }
        }

        async function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('loginError');
            if (!username || !password) { errorDiv.textContent = 'Podaj nazwę użytkownika i hasło'; return; }
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logowanie...';
            errorDiv.textContent = '';
            try {
                const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
                if (!res.ok) throw new Error('Invalid credentials');
                const data = await res.json();
                authToken = data.token;
                localStorage.setItem('neptune_token', authToken);
                document.getElementById('loginScreen').classList.add('hidden');
                initApp();
            } catch (e) {
                errorDiv.textContent = 'Błędne dane logowania';
                loginBtn.disabled = false;
                loginBtn.textContent = 'LOGIN';
            }
        }

        function logout() {
            if (authToken) fetch('/api/auth/logout', { method: 'POST', headers: { 'Authorization': `Bearer ${authToken}` } }).catch(() => {});
            localStorage.removeItem('neptune_token');
            authToken = null;
            if (wsPanel) { wsPanel.close(); wsPanel = null; }
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('content').innerHTML = '';
        }

        async function apiFetch(url, options = {}) {
            if (!authToken) throw new Error('No token');
            const res = await fetch(url, { ...options, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}`, ...(options.headers || {}) } });
            if (res.status === 401) { logout(); throw new Error('Unauthorized'); }
            if (!res.ok) { const err = await res.json().catch(() => ({ error: 'Request failed' })); throw new Error(err.error || 'Request failed'); }
            return res.json();
        }

        document.getElementById('sidebarNav').addEventListener('click', (e) => {
            const link = e.target.closest('a');
            if (!link || !link.dataset.page) return;
            e.preventDefault();
            navigateTo(link.dataset.page);
        });

        function navigateTo(page) {
            currentPage = page;
            document.querySelectorAll('#sidebarNav a').forEach(a => a.classList.remove('active'));
            const activeLink = document.querySelector(`#sidebarNav a[data-page="${page}"]`);
            if (activeLink) activeLink.classList.add('active');
            document.getElementById('pageTitle').textContent = page.charAt(0).toUpperCase() + page.slice(1);
            loadPage(page);
        }

        async function loadPage(page) {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="card">Loading...</div>';
            try {
                switch (page) {
                    case 'dashboard': await loadDashboard(); break;
                    case 'servers': await loadServers(); break;
                    case 'chat': await loadChat(); break;
                    case 'console': await loadConsole(); break;
                    case 'players': await loadPlayers(); break;
                    case 'moderation': await loadModeration(); break;
                    case 'automessages': await loadAutomessages(); break;
                    case 'filters': await loadFilters(); break;
                    case 'messages': await loadMessages(); break;
                    case 'admins': await loadAdmins(); break;
                    case 'logs': await loadLogs(); break;
                    case 'settings': await loadSettings(); break;
                }
            } catch (e) {
                content.innerHTML = `<div class="card"><p style="color: var(--danger);">Error: ${esc(e.message)}</p></div>`;
            }
        }

        // ==================== DASHBOARD ====================
        async function loadDashboard() {
            const data = await apiFetch('/api/dashboard');
            const s = data.stats;
            document.getElementById('content').innerHTML = `
                <div class="grid">
                    <div class="card"><h3>Online Servers</h3><div class="stat">${s.onlineServers}/${s.totalServers}</div></div>
                    <div class="card"><h3>Online Players</h3><div class="stat">${s.onlinePlayers}</div></div>
                    <div class="card"><h3>Messages Today</h3><div class="stat">${s.messagesToday}</div></div>
                    <div class="card"><h3>Active Mutes</h3><div class="stat">${s.activeMutes}</div></div>
                    <div class="card"><h3>Active Bans</h3><div class="stat">${s.activeBans}</div></div>
                    <div class="card"><h3>Warnings Today</h3><div class="stat">${s.warningsToday}</div></div>
                </div>
                <div class="grid">
                    <div class="card">
                        <h3>Recent Moderation Actions</h3>
                        <table>
                            <thead><tr><th>Time</th><th>Player</th><th>Action</th><th>Reason</th></tr></thead>
                            <tbody>${data.recentPunishments.length > 0 ? data.recentPunishments.map(p => `<tr><td>${new Date(p.created_at * 1000).toLocaleTimeString()}</td><td>${esc(p.player_name)}</td><td>${esc(p.action)}</td><td>${esc(p.reason)}</td></tr>`).join('') : '<tr><td colspan="4">Brak akcji</td></tr>'}</tbody>
                        </table>
                    </div>
                    <div class="card">
                        <h3>Recent Messages</h3>
                        <table>
                            <thead><tr><th>Time</th><th>Player</th><th>Message</th></tr></thead>
                            <tbody>${data.recentMessages && data.recentMessages.length > 0 ? data.recentMessages.map(m => `<tr><td>${new Date(m.timestamp * 1000).toLocaleTimeString()}</td><td>${esc(m.player_name)}</td><td>${esc(m.message)}</td></tr>`).join('') : '<tr><td colspan="3">Brak wiadomości</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // ==================== SERVERS ====================
        async function loadServers() {
            serversList = await apiFetch('/api/servers');
            document.getElementById('content').innerHTML = `
                <div class="card">
                    <h2>Servers <button class="success" style="float:right" onclick="showAddServer()">+ Dodaj serwer</button></h2>
                    <table>
                        <thead><tr><th>Status</th><th>Name</th><th>IP</th><th>Players</th><th>Actions</th></tr></thead>
                        <tbody>${serversList.length > 0 ? serversList.map(s => `<tr>
                            <td>${s.online ? '<span class="badge online">ONLINE</span>' : '<span class="badge offline">OFFLINE</span>'}</td>
                            <td>${esc(s.name)}</td>
                            <td>${esc(s.ip)}:${s.port}</td>
                            <td>${s.playerCount || 0}</td>
                            <td>
                                <button class="small info" onclick="showServerInfo('${s.id}')">Info</button>
                                <button class="small" onclick="selectServer('${s.id}','chat')">Chat</button>
                                <button class="small" onclick="selectServer('${s.id}','console')">RCON</button>
                                <button class="small warning" onclick="editServer('${s.id}')">Edit</button>
                                <button class="small danger" onclick="deleteServer('${s.id}')">Delete</button>
                            </td>
                        </tr>`).join('') : '<tr><td colspan="5">Brak serwerów</td></tr>'}</tbody>
                    </table>
                </div>
            `;
        }

        function showServerInfo(serverId) {
            const server = serversList.find(s => s.id === serverId);
            if (!server) { showToast('Server not found', 'error'); return; }
            
            const configText = `backend:\\n  enabled: true\\n  url: "wss://${window.location.host}/ws-plugin"\\n  server-id: "${server.id}"\\n  token: "${server.api_token}"`;
            
            document.getElementById('content').innerHTML = `
                <button class="ghost back-btn" onclick="loadServers()">← Powrót</button>
                <div class="card">
                    <h2>Server Info - ${esc(server.name)}</h2>
                    <div class="info-row"><span class="info-label">ID:</span><span class="info-value">${esc(server.id)}</span></div>
                    <div class="info-row"><span class="info-label">Name:</span><span class="info-value">${esc(server.name)}</span></div>
                    <div class="info-row"><span class="info-label">IP:</span><span class="info-value">${esc(server.ip)}</span></div>
                    <div class="info-row"><span class="info-label">Port:</span><span class="info-value">${server.port}</span></div>
                    <div class="info-row"><span class="info-label">Status:</span><span class="info-value">${server.online ? '🟢 Online' : '🔴 Offline'}</span></div>
                    <div class="info-row"><span class="info-label">Players:</span><span class="info-value">${server.playerCount || 0}</span></div>
                    <div class="info-row"><span class="info-label">RCON:</span><span class="info-value">${server.rcon_enabled ? '✅ Enabled' : '❌ Disabled'}</span></div>
                    <div class="info-row"><span class="info-label">Query:</span><span class="info-value">${server.query_enabled ? '✅ Enabled' : '❌ Disabled'}</span></div>
                    <div class="info-row" style="margin-top: 15px; border-bottom: none;"><span class="info-label">API Token:</span></div>
                    <div class="token-display" onclick="copyText('${esc(server.api_token)}')" title="Kliknij aby skopiować">${esc(server.api_token)}</div>
                    <p style="color: var(--text-dim); font-size: 0.85em; margin-top: 10px;">Kliknij na token aby skopiować</p>
                    
                    <h3 style="margin-top: 25px;">Konfiguracja pluginu (config.yml)</h3>
                    <pre class="console-output" style="color: var(--text);">backend:
  enabled: true
  url: "wss://${window.location.host}/ws-plugin"
  server-id: "${esc(server.id)}"
  token: "${esc(server.api_token)}"</pre>
                    <button class="small" onclick="copyText(\`${configText}\`)">📋 Copy Config</button>
                    
                    <div style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
                        <button class="small" onclick="copyText('${esc(server.api_token)}')">📋 Copy Token</button>
                        <button class="small" onclick="loadServers()">Back</button>
                    </div>
                </div>
            `;
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('Skopiowano do schowka!', 'success');
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('Skopiowano do schowka!', 'success');
            });
        }

        function showAddServer() {
            document.getElementById('content').innerHTML = `
                <button class="ghost back-btn" onclick="loadServers()">← Powrót</button>
                <div class="card">
                    <h2>Dodaj serwer</h2>
                    <input type="text" id="srvName" placeholder="Nazwa serwera (np. Survival)">
                    <div class="form-row">
                        <input type="text" id="srvIp" placeholder="Adres IP (np. 127.0.0.1)">
                        <input type="number" id="srvPort" placeholder="Port (np. 25565)" value="25565">
                    </div>
                    
                    <h3 style="margin-top: 20px;">RCON (opcjonalnie)</h3>
                    <div class="checkbox-group">
                        <label><input type="checkbox" id="srvRconEnabled" onchange="toggleFields()"> Włącz RCON</label>
                    </div>
                    <div id="rconFields" class="hidden">

        async function addServer() {
            const name = document.getElementById('srvName').value.trim();
            const ip = document.getElementById('srvIp').value.trim();
            const port = parseInt(document.getElementById('srvPort').value);
            const rcon_enabled = document.getElementById('srvRconEnabled').checked;
            const rcon_port = rcon_enabled ? parseInt(document.getElementById('srvRconPort').value) : null;
            const rcon_password = rcon_enabled ? document.getElementById('srvRconPassword').value : null;
            const query_enabled = document.getElementById('srvQueryEnabled').checked;
            const query_port = query_enabled ? parseInt(document.getElementById('srvQueryPort').value) : null;
            
            if (!name || !ip || !port) { showToast('Wypełnij wymagane pola', 'error'); return; }
            if (rcon_enabled && (!rcon_port || !rcon_password)) { showToast('Uzupełnij dane RCON', 'error'); return; }
            
            try {
                const res = await apiFetch('/api/servers', { 
                    method: 'POST', 
                    body: JSON.stringify({ name, ip, port, rcon_enabled, rcon_port, rcon_password, query_enabled, query_port }) 
                });
                showToast('Serwer dodany!', 'success');
                serversList = await apiFetch('/api/servers');
                showServerInfo(res.id);
            } catch (e) { showToast(e.message, 'error'); }
        }

        function appendChatMessage(msg) {
            const container = document.getElementById('chatMessages');
            if (!container) return;
            const div = document.createElement('div');
            div.className = 'chat-message';
            const time = new Date(msg.timestamp || Date.now()).toLocaleTimeString();
            div.innerHTML = `<span class="time">${time}</span><span class="player">${esc(msg.player_name || 'Unknown')}</span><span>${esc(msg.message)}</span>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            if (!input) return;
            const message = input.value.trim();
            if (!message) return;
            try { 
                await apiFetch(`/api/servers/${currentServerId}/chat`, { method: 'POST', body: JSON.stringify({ message }) }); 
                input.value = ''; 
            } catch (e) { showToast(e.message, 'error'); }

        async function sendRconCommand() {
            const input = document.getElementById('consoleInput');
            const output = document.getElementById('consoleOutput');
            const command = input.value.trim();
            if (!command) return;
            output.textContent += `\n> ${command}\n`;
            input.value = '';
            try {
                const res = await apiFetch(`/api/servers/${currentServerId}/rcon`, {
                    method: 'POST',
                    body: JSON.stringify({ command })
                });
                output.textContent += `${res.response || '(brak odpowiedzi)'}\n`;
            } catch (e) {
                output.textContent += `[ERROR] ${e.message}\n`;
            }
            output.scrollTop = output.scrollHeight;
        }

        function showModForm(action) {
            const needsDuration = action === 'mute' || action === 'ban';
            const serverOptions = serversList.map(s => `<option value="${s.id}" ${s.id === currentServerId ? 'selected' : ''}>${esc(s.name)} ${s.online ? '🟢' : '🔴'}</option>`).join('');
            document.getElementById('modForm').innerHTML = `
                <div style="border-top: 1px solid var(--border); margin-top: 20px; padding-top: 20px;">

                    <select id="modServerId">
                        <option value="">-- Wybierz serwer --</option>
                        ${serverOptions}
                    </select>
                    <input type="text" id="modPlayerName" placeholder="Nick gracza">
                    ${needsDuration ? `
                        <input type="number" id="modDuration" placeholder="Czas trwania w milisekundach" value="3600000">
                        <div class="quick-durations">
                            <button type="button" onclick="setDuration(60000)">1 min</button>
                            <button type="button" onclick="setDuration(300000)">5 min</button>
                            <button type="button" onclick="setDuration(1800000)">30 min</button>
                            <button type="button" onclick="setDuration(3600000)">1 godz</button>
                            <button type="button" onclick="setDuration(21600000)">6 godz</button>
                            <button type="button" onclick="setDuration(86400000)">1 dzień</button>
                            <button type="button" onclick="setDuration(604800000)">7 dni</button>
                            <button type="button" onclick="setDuration(2592000000)">30 dni</button>
                        </div>
                    ` : ''}
                    <input type="text" id="modReason" placeholder="Powód">
                    <div style="display: flex; gap: 10px;">
                        <button class="success" onclick="submitModAction('${action}')">Wykonaj</button>
                        <button class="ghost" onclick="document.getElementById('modForm').innerHTML=''">Anuluj</button>
                    </div>
                </div>
            `;
        }

        function setDuration(ms) {
            const el = document.getElementById('modDuration');
            if (el) el.value = ms;
        }

        async function submitModAction(action) {
            const server_id = document.getElementById('modServerId').value;
            const player_name = document.getElementById('modPlayerName').value.trim();
            const reason = document.getElementById('modReason')?.value || '';
            const duration = (action === 'mute' || action === 'ban') ? parseInt(document.getElementById('modDuration').value) : 0;
            
            if (!server_id || !player_name) { showToast('Wybierz serwer i podaj nick gracza', 'error'); return; }
            if ((action === 'mute' || action === 'ban') && (!duration || duration <= 0)) { showToast('Podaj prawidłowy czas trwania', 'error'); return; }
            
            try { 
                await apiFetch(`/api/moderation/${action}`, { 
                    method: 'POST', 
                    body: JSON.stringify({ server_id, player_name, duration, reason }) 
                }); 
                showToast(`Akcja ${action} wysłana do serwera`, 'success'); 
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function quickModAction(action) {
            if (!currentServerId) { 
                if (serversList.length === 0) serversList = await apiFetch('/api/servers');
                const serverOptions = serversList.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
                document.getElementById('modForm').innerHTML = `
                    <div style="border-top: 1px solid var(--border); margin-top: 20px; padding-top: 20px;">
                        <h3>${action.toUpperCase()} - wybierz serwer</h3>
                        <select id="quickServerId">${serverOptions}</select>
                        <button class="success" onclick="executeQuickAction('${action}')">Wykonaj</button>
                        <button class="ghost" onclick="document.getElementById('modForm').innerHTML=''">Anuluj</button>
                    </div>
                `;
                return;
            }
            executeQuickAction(action);
        }

        async function executeQuickAction(action) {
            const serverId = currentServerId || document.getElementById('quickServerId')?.value;
            if (!serverId) { showToast('Wybierz serwer', 'error'); return; }
            try {
                if (action === 'clear') {
                    await apiFetch('/api/moderation/clear-chat', { method: 'POST', body: JSON.stringify({ server_id: serverId }) });
                } else {
                    await apiFetch('/api/moderation/chat-lock', { method: 'POST', body: JSON.stringify({ server_id: serverId, locked: action === 'lock' }) });
                }
                showToast('Wykonano', 'success');
                document.getElementById('modForm').innerHTML = '';
            } catch (e) { showToast(e.message, 'error'); }
        }

                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <button class="success" onclick="saveAutomessageEdit(${id})">💾 Zapisz</button>
                        <button class="ghost" onclick="loadAutomessages()">Anuluj</button>
                    </div>
                </div>
            `;
        }

        async function saveAutomessageEdit(id) {
            const name = document.getElementById('amName').value.trim();
            const content = document.getElementById('amContent').value.trim();
            const interval_seconds = parseInt(document.getElementById('amInterval').value);
            const enabled = document.getElementById('amEnabled').checked;
            try {
                await apiFetch(`/api/automessages/${id}`, { 
                    method: 'PUT', 
                    body: JSON.stringify({ name, content, interval_seconds, enabled }) 
                });
                showToast('Zaktualizowano', 'success');
                loadAutomessages();
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function deleteAutomessage(id) {
            if (!confirm('Usunąć tę wiadomość?')) return;
            try {
                await apiFetch(`/api/automessages/${id}`, { method: 'DELETE' });
                showToast('Usunięto', 'success');
                loadAutomessages();
            } catch (e) { showToast(e.message, 'error'); }
        }

        // ==================== FILTERS ====================
        async function loadFilters() {
            const filters = await apiFetch('/api/filters');
            document.getElementById('content').innerHTML = `
                <div class="card">
                    <h2>Filter Words <button class="success" style="float:right" onclick="showAddFilter()">+ Dodaj filtr</button></h2>
                    <p style="color: var(--text-dim); margin-bottom: 15px;">Filtry są automatycznie synchronizowane z pluginami po zmianie.</p>
                    <table>
                        <thead><tr><th>Słowo</th><th>Akcja</th><th>Czas (mute/ban)</th><th>Status</th><th>Akcje</th></tr></thead>
                        <tbody>${filters.length > 0 ? filters.map(f => `<tr>
                            <td>${esc(f.word)}</td>
                            <td><span class="badge warning">${esc(f.action)}</span></td>
                            <td>${(f.action === 'MUTE' || f.action === 'BAN') ? formatDurationMs(f.duration_ms) : '-'}</td>
                            <td>${f.enabled ? '<span class="badge online">Aktywny</span>' : '<span class="badge offline">Wyłączony</span>'}</td>
                            <td>
                                <button class="small warning" onclick="showEditFilter(${f.id})">Edytuj</button>
                                <button class="small danger" onclick="deleteFilter(${f.id})">Usuń</button>
                            </td>
                        </tr>`).join('') : '<tr><td colspan="5">Brak filtrów</td></tr>'}</tbody>
                    </table>
                </div>
            `;
        }

        function showAddFilter() {
            document.getElementById('content').innerHTML = `
                <button class="ghost back-btn" onclick="loadFilters()">← Powrót</button>
                <div class="card">
                    <h2>Dodaj filtr</h2>
                    <input type="text" id="filterWord" placeholder="Słowo do filtrowania">
                    <select id="filterAction" onchange="toggleFilterDuration()">
                        <option value="REPLACE">REPLACE - zastąp gwiazdkami</option>
                        <option value="BLOCK">BLOCK - zablokuj wiadomość</option>
                        <option value="WARN">WARN - ostrzeż gracza</option>
                        <option value="MUTE">MUTE - wycisz gracza (na czas)</option>
                        <option value="BAN">BAN - zbanuj gracza (na czas)</option>
                        <option value="KICK">KICK - wyrzuć gracza</option>
                    </select>
                    
                    <div id="filterDurationSection" class="hidden">
                        <label style="color: var(--text-dim); font-size: 0.9em;">Czas trwania (ms):</label>
                        <input type="number" id="filterDuration" placeholder="Czas w milisekundach" value="300000">
                        <div class="quick-durations">
                            <button type="button" onclick="setFilterDuration(60000)">1 min</button>
                            <button type="button" onclick="setFilterDuration(300000)">5 min</button>
                            <button type="button" onclick="setFilterDuration(1800000)">30 min</button>
                            <button type="button" onclick="setFilterDuration(3600000)">1 godz</button>
                            <button type="button" onclick="setFilterDuration(21600000)">6 godz</button>
                            <button type="button" onclick="setFilterDuration(86400000)">1 dzień</button>
                            <button type="button" onclick="setFilterDuration(604800000)">7 dni</button>
                            <button type="button" onclick="setFilterDuration(2592000000)">30 dni</button>
                        </div>
                    </div>
                    
                    <label style="display: flex; align-items: center; color: var(--text-dim); margin-bottom: 10px;">
                        <input type="checkbox" id="filterEnabled" checked> Aktywny
                    </label>
                    <div style="display: flex; gap: 10px;">
                        <button class="success" onclick="addFilter()">💾 Zapisz</button>
                        <button class="ghost" onclick="loadFilters()">Anuluj</button>
                    </div>
                </div>
            `;
        }

        function toggleFilterDuration() {
            const action = document.getElementById('filterAction').value;
            const section = document.getElementById('filterDurationSection');
            const durationInput = document.getElementById('filterDuration');
            
            if (action === 'MUTE') {
                section.classList.remove('hidden');
                if (!durationInput.value || durationInput.value === '86400000') durationInput.value = '300000';
            } else if (action === 'BAN') {
                section.classList.remove('hidden');
                if (!durationInput.value || durationInput.value === '300000') durationInput.value = '86400000';
            } else {
                section.classList.add('hidden');
            }
        }

        function setFilterDuration(ms) {
            const el = document.getElementById('filterDuration');
            if (el) el.value = ms;
        }

        async function addFilter() {
            const word = document.getElementById('filterWord').value.trim();
            const action = document.getElementById('filterAction').value;
            const enabled = document.getElementById('filterEnabled').checked;
            const durationInput = document.getElementById('filterDuration');
            const duration_ms = (action === 'MUTE' || action === 'BAN') ? parseInt(durationInput.value) : 0;
            
            if (!word) { showToast('Podaj słowo', 'error'); return; }
            if ((action === 'MUTE' || action === 'BAN') && (!duration_ms || duration_ms <= 0)) { 
                showToast('Podaj prawidłowy czas trwania', 'error'); 
                return; 
            }
            
            try {
                await apiFetch('/api/filters', { 
                    method: 'POST', 
                    body: JSON.stringify({ word, action, enabled, duration_ms }) 
                });
                showToast('Filtr dodany i zsynchronizowany z pluginami', 'success');
                loadFilters();
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function showEditFilter(id) {
            const filters = await apiFetch('/api/filters');
            const f = filters.find(x => x.id === id);
            if (!f) return;
            
            const needsDuration = f.action === 'MUTE' || f.action === 'BAN';
            
            document.getElementById('content').innerHTML = `
                <button class="ghost back-btn" onclick="loadFilters()">← Powrót</button>
                <div class="card">
                    <h2>Edytuj filtr</h2>
                    <input type="text" id="filterWord" value="${esc(f.word)}">
                    <select id="filterAction" onchange="toggleFilterDuration()">
                        <option value="REPLACE" ${f.action === 'REPLACE' ? 'selected' : ''}>REPLACE - zastąp gwiazdkami</option>
                        <option value="BLOCK" ${f.action === 'BLOCK' ? 'selected' : ''}>BLOCK - zablokuj wiadomość</option>
                        <option value="WARN" ${f.action === 'WARN' ? 'selected' : ''}>WARN - ostrzeż gracza</option>
                        <option value="MUTE" ${f.action === 'MUTE' ? 'selected' : ''}>MUTE - wycisz gracza</option>
                        <option value="BAN" ${f.action === 'BAN' ? 'selected' : ''}>BAN - zbanuj gracza</option>
                        <option value="KICK" ${f.action === 'KICK' ? 'selected' : ''}>KICK - wyrzuć gracza</option>
                    </select>
                    
                    <div id="filterDurationSection" class="${needsDuration ? '' : 'hidden'}">
                        <label style="color: var(--text-dim); font-size: 0.9em;">Czas trwania (ms):</label>
                        <input type="number" id="filterDuration" placeholder="Czas w milisekundach" value="${f.duration_ms || 300000}">
                        <div class="quick-durations">
                            <button type="button" onclick="setFilterDuration(60000)">1 min</button>
                            <button type="button" onclick="setFilterDuration(300000)">5 min</button>
                            <button type="button" onclick="setFilterDuration(1800000)">30 min</button>
                            <button type="button" onclick="setFilterDuration(3600000)">1 godz</button>
                            <button type="button" onclick="setFilterDuration(21600000)">6 godz</button>
                            <button type="button" onclick="setFilterDuration(86400000)">1 dzień</button>
                            <button type="button" onclick="setFilterDuration(604800000)">7 dni</button>
                            <button type="button" onclick="setFilterDuration(2592000000)">30 dni</button>
                        </div>
                    </div>
                    
                    <label style="display: flex; align-items: center; color: var(--text-dim); margin-bottom: 10px;">
                        <input type="checkbox" id="filterEnabled" ${f.enabled ? 'checked' : ''}> Aktywny
                    </label>
                    <div style="display: flex; gap: 10px;">
                        <button class="success" onclick="saveFilterEdit(${id})">💾 Zapisz</button>
                        <button class="ghost" onclick="loadFilters()">Anuluj</button>
                    </div>
                </div>
            `;
        }

        async function saveFilterEdit(id) {
            const word = document.getElementById('filterWord').value.trim();
            const action = document.getElementById('filterAction').value;
            const enabled = document.getElementById('filterEnabled').checked;
            const durationInput = document.getElementById('filterDuration');
            const duration_ms = (action === 'MUTE' || action === 'BAN') ? parseInt(durationInput.value) : 0;
            
            if ((action === 'MUTE' || action === 'BAN') && (!duration_ms || duration_ms <= 0)) { 
                showToast('Podaj prawidłowy czas trwania', 'error'); 
                return; 
            }
            
            try {
                await apiFetch(`/api/filters/${id}`, { 
                    method: 'PUT', 
                    body: JSON.stringify({ word, action, enabled, duration_ms }) 
                });
                showToast('Zaktualizowano', 'success');
                loadFilters();
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function deleteFilter(id) {
            if (!confirm('Usunąć filtr?')) return;
            try {
                await apiFetch(`/api/filters/${id}`, { method: 'DELETE' });
                showToast('Usunięto', 'success');
                loadFilters();
            } catch (e) { showToast(e.message, 'error'); }
        }

        // ==================== MESSAGES ====================
        async function loadMessages() {
            const files = await apiFetch('/api/messages/files');
            let backups = [];
            try { backups = await apiFetch('/api/messages/backups'); } catch (e) {}
            
            document.getElementById('content').innerHTML = `
                <div class="card">
                    <h2>Message Files</h2>
                    <div class="grid">
                        <div class="card">
                            <h3>messages.json (Wszystkie)</h3>
                            <p>Wiadomości: <strong>${files.messages_file.total}</strong></p>
                            <p>Rozmiar: ${files.messages_file.size_kb} KB</p>
                            <button onclick="viewMessages('all')">📖 Zobacz</button>
                        </div>
                        <div class="card">
                            <h3>messages-read.json (Dzisiaj)</h3>
                            <p>Data: <strong>${esc(files.messages_read_file.date)}</strong></p>
                            <p>Wiadomości: <strong>${files.messages_read_file.total}</strong></p>
                            <p>Rozmiar: ${files.messages_read_file.size_kb} KB</p>
                            <button onclick="viewMessages('today')">📖 Zobacz</button>
                        </div>
                    </div>
                    <div id="messagesContent"></div>
                </div>
                
                ${backups.length > 0 ? `
                <div class="card">
                    <h3>Backupy (${backups.length})</h3>
                    <table>
                        <thead><tr><th>Plik</th><th>Rozmiar</th></tr></thead>
                        <tbody>${backups.map(b => `<tr><td>${esc(b.name)}</td><td>${b.size_kb} KB</td></tr>`).join('')}</tbody>
                    </table>
                </div>
                ` : ''}
            `;
        }

        async function viewMessages(type) {
            const data = await apiFetch(`/api/messages/file/${type}?limit=500`);
            document.getElementById('messagesContent').innerHTML = `
                <div style="border-top: 1px solid var(--border); margin-top: 20px; padding-top: 20px;">
                    <h3>${esc(data.file)} (${data.total} wiadomości)</h3>
                    <div style="max-height: 500px; overflow-y: auto;">
                        <table>
                            <thead><tr><th>Data</th><th>Gracz</th><th>Serwer</th><th>Wiadomość</th></tr></thead>
                            <tbody>${data.messages.map(m => `<tr>
                                <td>${new Date(m.timestamp).toLocaleString()}</td>
                                <td>${esc(m.player_name)}</td>
                                <td>${esc(m.server_id)}</td>
                                <td>${esc(m.message)}</td>
                            </tr>`).join('')}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // ==================== ADMINS ====================
        async function loadAdmins() {
            const admins = await apiFetch('/api/admins');
            document.getElementById('content').innerHTML = `
                <div class="card">
                    <h2>Administrators <button class="success" style="float:right" onclick="showAddAdmin()">+ Dodaj administratora</button></h2>
                    <table>
                        <thead><tr><th>Username</th><th>Minecraft Nick</th><th>Powiadomienia</th><th>Utworzono</th><th>Akcje</th></tr></thead>
                        <tbody>${admins.length > 0 ? admins.map(a => `<tr>
                            <td>${esc(a.username)}</td>
                            <td>${esc(a.minecraft_nick || '-')}</td>
                            <td>
                                ${a.notify_minecraft ? '🎮' : ''}
                                ${a.notify_webpush ? '🔔' : ''}
                                ${a.notify_discord ? '💬' : ''}
                                ${!a.notify_minecraft && !a.notify_webpush && !a.notify_discord ? '-' : ''}
                            </td>
                            <td>${a.created_at ? new Date(a.created_at * 1000).toLocaleDateString() : '-'}</td>
                            <td><button class="small danger" onclick="deleteAdmin(${a.id})">Usuń</button></td>
                        </tr>`).join('') : '<tr><td colspan="5">Brak administratorów</td></tr>'}</tbody>
                    </table>
                </div>
            `;
        }

        function showAddAdmin() {
            document.getElementById('content').innerHTML = `
                <button class="ghost back-btn" onclick="loadAdmins()">← Powrót</button>
                <div class="card">
                    <h2>Dodaj administratora</h2>
                    <input type="text" id="adminUsername" placeholder="Nazwa użytkownika">
                    <input type="password" id="adminPassword" placeholder="Hasło (min. 6 znaków)">
                    <input type="password" id="adminPasswordConfirm" placeholder="Potwierdź hasło">
                    <input type="text" id="adminMinecraftNick" placeholder="Minecraft Nick (opcjonalnie)">
                    
                    <h3 style="margin-top: 15px;">Powiadomienia</h3>
                    <div class="checkbox-group">
                        <label><input type="checkbox" id="adminNotifyMinecraft" checked> 🎮 Minecraft</label>
                        <label><input type="checkbox" id="adminNotifyWebpush"> 🔔 Web Push</label>
                        <label><input type="checkbox" id="adminNotifyDiscord"> 💬 Discord</label>
                    </div>
                    
                    <div style="display: flex; gap: 10px; margin-top: 20px;">
                        <button class="success" onclick="addAdmin()">💾 Zapisz</button>
                        <button class="ghost" onclick="loadAdmins()">Anuluj</button>
                    </div>
                </div>
            `;
        }

        async function addAdmin() {
            const username = document.getElementById('adminUsername').value.trim();
            const password = document.getElementById('adminPassword').value;
            const confirm = document.getElementById('adminPasswordConfirm').value;
            const minecraft_nick = document.getElementById('adminMinecraftNick').value.trim();
            const notify_minecraft = document.getElementById('adminNotifyMinecraft').checked ? 1 : 0;
            const notify_webpush = document.getElementById('adminNotifyWebpush').checked ? 1 : 0;
            const notify_discord = document.getElementById('adminNotifyDiscord').checked ? 1 : 0;
            
            if (!username || !password) { showToast('Wypełnij wszystkie pola', 'error'); return; }
            if (password.length < 6) { showToast('Hasło musi mieć min. 6 znaków', 'error'); return; }
            if (password !== confirm) { showToast('Hasła nie są identyczne', 'error'); return; }
            
            try {
                await apiFetch('/api/admins', { 
                    method: 'POST', 
                    body: JSON.stringify({ username, password, minecraft_nick, notify_minecraft, notify_webpush, notify_discord }) 
                });
                showToast('Administrator dodany', 'success');
                loadAdmins();
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function deleteAdmin(id) {
            if (!confirm('Usunąć tego administratora?')) return;
            try {
                await apiFetch(`/api/admins/${id}`, { method: 'DELETE' });
                showToast('Usunięto', 'success');
                loadAdmins();
            } catch (e) { showToast(e.message, 'error'); }
        }

        // ==================== LOGS ====================
        async function loadLogs() {
            const logs = await apiFetch('/api/logs');
            document.getElementById('content').innerHTML = `
                <div class="card">
                    <h2>Audit Logs</h2>
                    <table>
                        <thead><tr><th>Data</th><th>Akcja</th><th>Szczegóły</th><th>IP</th></tr></thead>
                        <tbody>${logs.length > 0 ? logs.map(l => `<tr>
                            <td>${new Date(l.timestamp * 1000).toLocaleString()}</td>
                            <td><span class="badge warning">${esc(l.action)}</span></td>
                            <td>${esc(l.details)}</td>
                            <td>${esc(l.ip || '-')}</td>
                        </tr>`).join('') : '<tr><td colspan="4">Brak logów</td></tr>'}</tbody>
                    </table>
                </div>
            `;
        }

        // ==================== SETTINGS ====================
        async function loadSettings() {
            const settings = await apiFetch('/api/settings');
            document.getElementById('content').innerHTML = `
                <div class="card">
                    <h2>Settings</h2>
                    <h3>Discord</h3>
                    <label style="color: var(--text-dim); font-size: 0.9em;">Discord Webhook URL</label>
                    <input type="text" id="setDiscordWebhook" value="${esc(settings.discord_webhook_url || '')}" placeholder="https://discord.com/api/webhooks/...">
                    
                    <h3 style="margin-top: 20px;">Web Push (VAPID)</h3>
                    <label style="color: var(--text-dim); font-size: 0.9em;">Public Key</label>
                    <input type="text" id="setWebPushPublic" value="${esc(settings.web_push_public_key || '')}" placeholder="Public VAPID key">
                    <label style="color: var(--text-dim); font-size: 0.9em;">Private Key</label>
                    <input type="password" id="setWebPushPrivate" value="${esc(settings.web_push_private_key || '')}" placeholder="Private VAPID key">
                    
                    <h3 style="margin-top: 20px;">Session</h3>
                    <label style="color: var(--text-dim); font-size: 0.9em;">Session timeout (minuty)</label>
                    <input type="number" id="setSessionTimeout" value="${esc(settings.session_timeout_minutes || '60')}">
                    
                    <div style="margin-top: 20px;">
                        <button class="success" onclick="saveSettings()">💾 Zapisz wszystkie ustawienia</button>
                    </div>
                </div>
            `;
        }

        async function saveSettings() {
            const discord_webhook_url = document.getElementById('setDiscordWebhook').value.trim();
            const web_push_public_key = document.getElementById('setWebPushPublic').value.trim();
            const web_push_private_key = document.getElementById('setWebPushPrivate').value.trim();
            const session_timeout_minutes = document.getElementById('setSessionTimeout').value.trim();
            
            try { 
                await apiFetch('/api/settings', { 
                    method: 'PUT', 
                    body: JSON.stringify({ discord_webhook_url, web_push_public_key, web_push_private_key, session_timeout_minutes }) 
                }); 
                showToast('Ustawienia zapisane', 'success'); 
            } catch (e) { showToast(e.message, 'error'); }
        }

        // ==================== TOAST ====================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ==================== INIT ====================
        function initApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            connectPanelWS();
            loadServers().then(() => navigateTo('dashboard')).catch(() => navigateTo('dashboard'));
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('loginPassword')?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') login();
            });
        });

        if (authToken) initApp();
    </script>
</body>
</html>
